[workspace]
members = ["crates/absence", "crates/absence-cli"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
authors = ["Kritarth Agrawal <singhalkritarth@gmail.com>"]
repository = "https://github.com/kritarth1107/Absence"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
clap = { version = "=4.4.18", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
# Pin zeroize/base64ct to avoid edition2024 crates (requires Rust nightly)
# Run: cargo update -p zeroize --precise 1.8.1 && cargo update -p base64ct --precise 1.6.0
# if fresh checkout fails to build
