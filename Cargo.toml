[workspace]
members = ["crates/absence", "crates/absence-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Kritarth Agrawal <singhalkritarth@gmail.com>"]
repository = "https://github.com/kritarth1107/Absence"

[workspace.dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
clap = { version = "=4.4.18", features = ["derive"] }
